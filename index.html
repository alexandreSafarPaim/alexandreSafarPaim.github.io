<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniGames Arcade - Ads</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .ad-container {
      text-align: center;
      width: 100%;
      max-width: 728px;
    }
    .ad-placeholder {
      width: 100%;
      height: 90px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px dashed #2a2a4a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a4a6a;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="ad-container">
    <!--
    ╔══════════════════════════════════════════════════════════════╗
    ║  CONFIGURAÇÃO DO ADSTERRA                                  ║
    ║                                                            ║
    ║  1. Crie uma conta em https://publishers.adsterra.com      ║
    ║  2. Adicione seu site (ex: seunome.github.io)              ║
    ║  3. Crie um bloco "Banner 728x90"                          ║
    ║  4. Copie a KEY que o Adsterra gerar                       ║
    ║  5. Substitua SUA_KEY_AQUI abaixo pela sua key             ║
    ║  6. Hospede esta página e atualize os iframes dos jogos    ║
    ╚══════════════════════════════════════════════════════════════╝
    -->

    <!-- Placeholder — será escondido quando o anúncio carregar -->
    <div class="ad-placeholder" id="placeholder">
      📢 Espaço para anúncio — Configure seu Adsterra
    </div>

    <!-- Descomente o bloco abaixo e coloque sua KEY do Adsterra -->
    <!--
    <script type="text/javascript">
      atOptions = {
        'key' : 'SUA_KEY_AQUI',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
      };
      document.getElementById('placeholder').style.display = 'none';
    </script>
    <script type="text/javascript" src="//www.topcreativeformat.com/SUA_KEY_AQUI/invoke.js"></script>
    -->
  </div>
</body>
</html>
